[project]
name = "hypnosis"
version = "0.1.0"
description = "Bounded harness execution, orchestration and a Carets application."
readme = "README.md"
authors = [
    { name = "ellainng", email = "299958882+ellainng@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "carets @ git+https://github.com/wispsy/carets.git@991c3bfc67c4c6aaa49fecb62c819618605f1d03",
    "expose-interface @ git+https://github.com/wispsy/expose_interface.git@8c71caefe67217bb6df87e280261746a3055fc86",
]

[project.scripts]
hypnosis = "hypnosis:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[project.optional-dependencies]
models = ["thoughtform[thoughtformula] @ git+https://github.com/wispsy/thoughtform.git@1217f8bf77eca5ac20c27d99cd694d58ec9039e7"]

[project.urls]
Source = "https://github.com/wispsy/hypnosis"
Project = "https://github.com/orgs/wispsy/projects/28"

[tool.uv.build-backend]
source-include = ["tests/**", "scripts/**", "IMPLEMENTATION_PLAN.md"]
