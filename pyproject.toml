[project]
name = "hypnosis"
version = "0.1.0a1"
description = "Bounded harness execution, orchestration and a Carets application."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
    { name = "ellainng", email = "299958882+ellainng@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "carets==0.2.0",
    "expose-interface==0.1.0",
]

[project.scripts]
hypnosis = "hypnosis:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[project.optional-dependencies]
application = [
    "hidden-moves==0.1.1",
    "hidden-moves-workspace==0.1.0a2",
    "parse-md==0.1.0",
    "backpack-store==0.2.0",
    "func-seq==0.1.0",
    "headless-spreadsheets==0.1.1",
]
context = [
    "hidden-moves-workspace==0.1.0a2",
    "parse-md==0.1.0",
]
tools = ["hidden-moves==0.1.1"]
workflow = ["func-seq==0.1.0"]
records = ["backpack-store==0.2.0"]
data = [
    "parse-md==0.1.0",
    "parse-mw==0.1.0",
    "engl==0.1.0a1",
]
models = ["thoughtform[thoughtformula]==0.1.0a1"]
training = [
    "parse-md==0.1.0",
    "thoughtform[thoughtformula]==0.1.0a1",
    "backpack-store==0.2.0",
    "func-seq==0.1.0",
    "engl==0.1.0a1",
    "parse-mw==0.1.0",
]

[project.urls]
Source = "https://github.com/wispsy/hypnosis"
Project = "https://github.com/orgs/wispsy/projects/28"

[tool.uv.build-backend]
source-include = ["docs/**", "tests/**", "scripts/**", "experiments/**", "IMPLEMENTATION_PLAN.md"]
