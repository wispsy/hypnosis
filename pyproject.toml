[project]
name = "hypnosis"
version = "0.1.0"
description = "Bounded harness execution, orchestration and a Carets application."
readme = "README.md"
authors = [
    { name = "ellainng", email = "299958882+ellainng@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "carets @ git+https://github.com/wispsy/carets.git@991c3bfc67c4c6aaa49fecb62c819618605f1d03",
    "expose-interface @ git+https://github.com/wispsy/expose_interface.git@8c71caefe67217bb6df87e280261746a3055fc86",
]

[project.scripts]
hypnosis = "hypnosis:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[project.optional-dependencies]
tools = ["hidden-moves @ git+https://github.com/wispsy/hidden_moves.git@fe5d822c82d5aa6e503fd3981161f97da113cdf0"]
workflow = ["func-seq @ git+https://github.com/wispsy/func_seq.git@bfb4c1d5bccc73f842d72ddb7809a11973acb9e4"]
records = ["backpack-store @ git+https://github.com/wispsy/backpack.git@77440f85a290a756e26c7180ccb2d092812f13b4"]
data = [
    "parse-md @ git+https://github.com/wispsy/parse_md.git@54ff935e4ef9218a5c6227eb4149b62a52f89ec1",
    "mwparserfromhell==0.7.2",
    "engl @ git+https://github.com/wispsy/engl.git@0d1de7f36a2cb4bc0b2eef28195c7046beda46ab",
]
models = ["thoughtform[thoughtformula] @ git+https://github.com/wispsy/thoughtform.git@6c28d496a4f2bcc613dc1a1e1e21bf2095833c78"]
training = [
    "parse-md @ git+https://github.com/wispsy/parse_md.git@54ff935e4ef9218a5c6227eb4149b62a52f89ec1",
    "thoughtform[thoughtformula] @ git+https://github.com/wispsy/thoughtform.git@6c28d496a4f2bcc613dc1a1e1e21bf2095833c78",
    "backpack-store @ git+https://github.com/wispsy/backpack.git@77440f85a290a756e26c7180ccb2d092812f13b4",
    "func-seq @ git+https://github.com/wispsy/func_seq.git@bfb4c1d5bccc73f842d72ddb7809a11973acb9e4",
    "engl @ git+https://github.com/wispsy/engl.git@0d1de7f36a2cb4bc0b2eef28195c7046beda46ab",
    "mwparserfromhell==0.7.2",
]

[project.urls]
Source = "https://github.com/wispsy/hypnosis"
Project = "https://github.com/orgs/wispsy/projects/28"

[tool.uv.build-backend]
source-include = ["tests/**", "scripts/**", "experiments/**", "IMPLEMENTATION_PLAN.md"]
